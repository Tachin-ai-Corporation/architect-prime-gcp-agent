name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check .mjs syntax
        run: |
          echo "Checking .mjs files for syntax errors..."
          find corekit -name "*.mjs" -print0 | xargs -0 -I {} node --check {}
          echo "All .mjs files pass syntax check."

      - name: Check shell scripts parse
        run: |
          echo "Parsing shell scripts..."
          FAILED=0
          for f in infra/install.sh \
                   $(find infra/bootstrap infra/deploy -name "*.sh" 2>/dev/null) \
                   corekit/system/* corekit/fleet/*; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^#!.*\(bash\|sh\)' || continue
            if bash -n "$f"; then echo "  OK  $f"; else echo "  FAIL $f"; FAILED=1; fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Validate JSON configs
        run: |
          echo "Validating JSON files..."
          FAILED=0
          for f in infra/contracts.json \
                   $(find corekit/config -name "*.json" 2>/dev/null) \
                   $(find corekit/config/processes -name "*.json" 2>/dev/null); do
            if [ -f "$f" ]; then
              if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; then
                echo "  ✅ $f"
              else
                echo "  ❌ $f"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "All JSON files valid."

  contracts:
    name: Contracts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # infra/contracts.json is generated from platform-defaults + fleet-policy.
      # A stale artifact means the live contract and its authored sources
      # disagree, which is exactly the drift C-7 exists to prevent.
      - name: Compiled contract is fresh
        run: node corekit/system/compile-contracts

      - name: Validate contracts
        run: bash corekit/system/validate-contracts --repo

  manifest-integrity:
    name: Manifest Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check manifest paths
        run: node --test test/manifest-integrity.test.mjs

  boundaries:
    name: Structural Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Its own job rather than a line in the unit run: a broken wall is a
      # different kind of failure from a broken function, and it should be
      # readable as such on the PR without opening a log.
      - name: Check structural boundaries (C-10, C-30)
        run: node --test test/boundaries.test.mjs

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both suites run. `tests/` (426 assertions) was outside CI entirely until
      # v2026.08.15 — a green build proved nothing about a third of the codebase.
      - name: Run test/ suite
        run: node --test test/*.test.mjs

      - name: Run tests/ suite
        run: node --test tests/*.test.mjs

  dashboard:
    name: Dashboard Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `npm install`: the lockfile is the contract. A build that
      # silently resolves a different dependency tree than the one reviewed is
      # not reproducible (C-35 in spirit — the same immutability argument).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # NOT YET A GATE. `npm run lint` currently reports 56 errors and 32
      # warnings inherited from the Next 16 / react-hooks v6 upgrade
      # (24 set-state-in-effect, 22 no-explicit-any, plus refs/purity/entities).
      # Adding a job that fails on every commit teaches people to ignore CI, so
      # the gate lands in the CLEANUP phase together with the fixes. Until then
      # it runs for visibility only — see docs/plans/THREE_PLANES_PLAN.md.
      - name: Lint (advisory — becomes a gate in CLEANUP)
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  scope-check:
    name: Scope Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR scope
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract Scope: block from PR body
          # Format: ```\nScope:\nglob1\nglob2\n```
          SCOPE_BLOCK=$(echo "$PR_BODY" | sed -n '/^Scope:$/,/^```$/p' | grep -v '^Scope:$' | grep -v '^```$' | grep -v '^$')

          # A missing Scope block used to exit 0 — the check reported success on
          # every PR that simply omitted it, which is every PR that would most
          # have benefited from it. Declaring scope is now mandatory.
          if [ -z "$SCOPE_BLOCK" ]; then
            echo "❌ No Scope: block found in the PR body."
            echo ""
            echo "Every PR must declare which paths it may touch. Add to the description:"
            echo ""
            echo '    ```'
            echo '    Scope:'
            echo '    corekit/lib/**'
            echo '    test/**'
            echo '    ```'
            exit 1
          fi

          echo "Scope globs found:"
          echo "$SCOPE_BLOCK"
          echo "---"

          # Get changed files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          # Check each changed file against scope globs
          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            MATCHED=false
            while IFS= read -r glob; do
              [ -z "$glob" ] && continue
              # Use bash pattern matching (convert glob to find-style)
              if echo "$file" | grep -q "$(echo "$glob" | sed 's/\*\*/.*/' | sed 's/\*/[^\/]*/')"; then
                MATCHED=true
                break
              fi
            done <<< "$SCOPE_BLOCK"
            if [ "$MATCHED" = false ]; then
              VIOLATIONS="$VIOLATIONS\n  ❌ $file"
            fi
          done <<< "$CHANGED"

          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "SCOPE VIOLATION — files changed outside declared scope:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Either expand the Scope: block or revert out-of-scope changes."
            exit 1
          fi

          echo "✅ All changed files are within declared scope."
