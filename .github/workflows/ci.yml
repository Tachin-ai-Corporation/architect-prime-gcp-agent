name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both roots. This walked only corekit/ and would have gone on passing
      # while checking almost nothing after the runtime moved to platform/ —
      # a hardcoded scan root does not report reduced coverage, it reports success.
      - name: Check .mjs syntax
        run: |
          echo "Checking .mjs files for syntax errors..."
          find platform corekit -name "*.mjs" -not -path "*/node_modules/*" -print0 \
            | xargs -0 -I {} node --check {}
          echo "All .mjs files pass syntax check."

      # Discovery is a DENY-list. This used to walk four corekit subdirectories
      # plus infra/, which reached 37 of the repo's 127 shell scripts. Outside it
      # sat EVERY shipped skill tool — the files a deployed agent executes at
      # mission time — and all twelve corekit/brain/ tools. A parse error in one
      # of those ships green here and fails on a VM mid-mission. A scan root that
      # excludes most of its subject does not report reduced coverage; it reports
      # success.
      #
      # Scope, stated so it is not over-read: `bash -n` catches PARSE errors. It
      # does not catch the quoting-bug class (the project-manage apostrophe break
      # parsed fine and failed at runtime) — that is what test/tool-hygiene.test.mjs
      # and per-tool tests are for. Proven by planting a missing `fi` in
      # skills/workspace-docs/docs-cat: old loop exit 0, this loop exit 1.
      #
      # The floor is not decoration: a discovery bug that matches nothing would
      # otherwise pass as "all clear", which is the same defect one level up.
      # Proven by narrowing ls-files to one directory: COUNT 3, exit 1.
      - name: Check shell scripts parse
        run: |
          set -uo pipefail
          FAILED=0
          COUNT=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!.*(bash|/sh|env sh)' || continue
            COUNT=$((COUNT+1))
            if bash -n "$f"; then :; else echo "  FAIL $f"; FAILED=1; fi
          done < <(git ls-files)
          echo "parsed $COUNT shell scripts"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::only $COUNT shell scripts discovered — expected ~127. Discovery is broken, not the repo clean."
            exit 1
          fi
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Validate JSON configs
        run: |
          echo "Validating JSON files..."
          FAILED=0
          for f in infra/contracts.json \
                   $(find corekit/config -name "*.json" 2>/dev/null) \
                   $(find corekit/config/processes -name "*.json" 2>/dev/null); do
            if [ -f "$f" ]; then
              if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; then
                echo "  ✅ $f"
              else
                echo "  ❌ $f"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "All JSON files valid."

  contracts:
    name: Contracts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # infra/contracts.json is generated from platform-defaults + fleet-policy.
      # A stale artifact means the live contract and its authored sources
      # disagree, which is exactly the drift C-7 exists to prevent.
      - name: Compiled contract is fresh
        run: node corekit/system/compile-contracts

      - name: Validate contracts
        run: bash corekit/system/validate-contracts --repo

  manifest-integrity:
    name: Manifest Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check manifest paths
        run: node --test test/manifest-integrity.test.mjs

      # The dest column is what a VM receives. Repo files can move freely; this
      # says so with arithmetic rather than confidence, and fails the moment a
      # reorganisation changes installed content instead of just its address.
      - name: Installed surface matches the lock
        run: node --test test/install-surface.test.mjs

      # Parsing a file does not resolve its imports. Without this, a specifier
      # pointing at nothing clears the syntax check and is found by a VM that
      # will not restart.
      - name: Installed tree resolves
        run: node --test test/module-resolution.test.mjs

      # What a VM executes is the stored blob. A launcher stored with CRLF has a
      # shebang ending in CR and Linux calls the interpreter missing.
      - name: Shipped files are stored with LF
        run: node --test test/line-endings.test.mjs

      # bootstrap runs only on a fresh deploy, so a path it reads that the
      # manifests stopped installing keeps working everywhere until the next hire.
      - name: Bootstrap reads only what is installed
        run: node --test test/bootstrap-paths.test.mjs

      # A living document that names a path it cannot produce teaches the wrong
      # shape. This covers the SHIPPED content too — skills, specialty bundles,
      # organ firmware — where a dead path is not a misled reader but an agent
      # instructed at runtime to open a file that is not there. Historical
      # records (docs/plans, the changelog, .agents/rules/project-context.md)
      # are out of scope by design.
      - name: Living docs and shipped skills cite files that exist
        run: node --test test/doc-paths.test.mjs

      # A fixed /tmp filename is owned by whoever runs the tool first; every later
      # run by another user fails curl with exit 23 and set -e swallows the message.
      - name: Shell tools use per-run temp files
        run: node --test test/tool-hygiene.test.mjs

      # A deployment with no sign-in configured must LOCK, not open a public
      # administrative mode. The setup wizard can rewrite OAuth config, read
      # Secret Manager and update the running service.
      - name: First-run setup surface is token-gated
        run: node --test test/setup-gate.test.mjs

      # A release id must mean ONE set of bytes. The daemon used to compile the
      # mutable branch tip and stamp it with the pinned release, so an agent could
      # run content nobody approved while every coordinate read correct.
      - name: A release resolves to fixed bytes
        run: node --test test/release-bytes.test.mjs

      # A release that drops a skill must remove it. The planner was correct and
      # fed a desired-only inventory, so its removal set was structurally empty
      # and a retired skill stayed installed while the sync reported success.
      - name: Retired content is retired
        run: node --test test/retired-content.test.mjs

      # The installer must not delete what a release owns. install.sh's orphan
      # sweep called any file under skills/ that no MANIFEST owns an orphan —
      # true before the Fleet Definition plane existed, and after it the sweep
      # deleted precisely the skills Prime is for, on every platform upgrade.
      - name: The installer respects content-plane ownership
        run: node --test test/content-plane-ownership.test.mjs

      # Reading the ownership record correctly is not the same as respecting it.
      # This runs the sweep block lifted out of install.sh over a tree holding all
      # three ownership cases, and asserts the counterfactual too — with no record
      # the release-owned skill IS deleted, which is what makes the survival a
      # proof rather than a coincidence.
      - name: The orphan sweep keeps release content and still removes orphans
        run: node --test test/orphan-sweep.test.mjs

      # An APPLIED release must be a LIVE release. SKILL_INDEX and the capability
      # map cortex plans against were both built once at module load, and the map
      # preferred a file that only a PLATFORM UPGRADE regenerated — so a skill a
      # release added reached neither. Every other property in the release path
      # sits upstream of this step.
      - name: An applied release is a live release
        run: node --test test/capability-refresh.test.mjs

      # A storage outage must not read as an empty world. read() returned null for
      # a 404, a 500 and a 403 alike and query() returned [] on failure, so the
      # lifecycle acted on the difference without knowing there was one. Includes
      # the wiring checks: strict must be passed at the TOP LEVEL of each call —
      # the transform that added them first nested it inside pathFor(), where it
      # parsed, read correctly in a grep, and did nothing.
      - name: The lifecycle fails closed on a storage failure
        run: node --test test/storage-fails-closed.test.mjs

      # A planted regression must fail the gate. `evaluate` compiled ONE spec from
      # the mutable branch tip and compared it to ITSELF, so every case came back
      # unchanged, regressions() was always empty, and the exit-4 gate could not
      # fire. compareRuns was always correct — the defect was entirely at the call
      # site, which is why a unit test of the pure function stayed green.
      - name: Evaluation compares two real runs
        run: node --test test/evaluation-compares-two-runs.test.mjs

      # The one verb the system exists for. The registry could release, assign,
      # evaluate and roll back content it had no way to WRITE — every definition
      # arrived through a one-time catalog import, so improving the fleet bottomed
      # out in a human editing repo files. Prime pipes a body in; the command
      # resolves the base revision and createChange seals it. The shell never
      # writes a definition.
      - name: Prime can author a definition
        run: node --test test/authoring-verb.test.mjs

  codeowners:
    name: CODEOWNERS Resolves
    runs-on: ubuntu-latest
    # Push only. The endpoint requires push access, and a pull_request from a
    # fork gets a read-only token — running it there would fail for a reason that
    # has nothing to do with CODEOWNERS.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # A CODEOWNERS owner that does not resolve to a real GitHub user or team
      # with access is not a weaker rule — GitHub ignores it, so the rule stops
      # existing while still reading like one. With "require review from Code
      # Owners" enabled, that means protection is configured and unenforced.
      #
      # This is also the only check a FORK gets: their copy names an org they do
      # not own, so every rule in it is inert until they replace the owner. This
      # job is how they find that out.
      - name: No unresolvable owners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! body="$(gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors" 2>&1)"; then
            echo "::error::Could not query CODEOWNERS errors — failing closed."
            echo "An unanswerable question about enforcement is not a yes."
            echo "$body"
            exit 1
          fi
          count="$(echo "$body" | jq '.errors | length')"
          if [ "$count" != "0" ]; then
            echo "::error::CODEOWNERS has ${count} unresolvable owner(s). Every affected rule is inert."
            echo "$body" | jq -r '.errors[] | "  line \(.line): \(.message) — \(.suggestion // "replace with an owner that has write access")"'
            echo ""
            echo "If you forked this template, replace the owner in .github/CODEOWNERS"
            echo "with a team or user in YOUR org that has write access."
            exit 1
          fi
          echo "All CODEOWNERS owners resolve."

  boundaries:
    name: Structural Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Its own job rather than a line in the unit run: a broken wall is a
      # different kind of failure from a broken function, and it should be
      # readable as such on the PR without opening a log.
      - name: Check structural boundaries (C-10, C-30)
        run: node --test test/boundaries.test.mjs

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both suites run. `tests/` (426 assertions) was outside CI entirely until
      # v2026.08.15 — a green build proved nothing about a third of the codebase.
      - name: Run test/ suite
        run: node --test test/*.test.mjs

      - name: Run tests/ suite
        run: node --test tests/*.test.mjs

  dashboard:
    name: Dashboard Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `npm install`: the lockfile is the contract. A build that
      # silently resolves a different dependency tree than the one reviewed is
      # not reproducible (C-35 in spirit — the same immutability argument).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # A GATE, as of CLEANUP. It reported 57 errors and ran with `|| true`,
      # which is a job that cannot fail and therefore says nothing.
      #
      # The 25 type and markup errors were FIXED, not suppressed — most of them
      # were `any` on Firestore work documents, and the WorkEnvelope type they
      # needed already existed and simply was not imported.
      #
      # The 32 react-hooks v6 errors are warnings, scoped and explained in
      # app/eslint.config.mjs. They are real, and fixing them changes runtime
      # behaviour on a dashboard behind NextAuth that CI cannot sign into — so
      # they are visible and tracked rather than swept.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  scope-check:
    name: Scope Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR scope
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract Scope: block from PR body
          # Format: ```\nScope:\nglob1\nglob2\n```
          SCOPE_BLOCK=$(echo "$PR_BODY" | sed -n '/^Scope:$/,/^```$/p' | grep -v '^Scope:$' | grep -v '^```$' | grep -v '^$')

          # A missing Scope block used to exit 0 — the check reported success on
          # every PR that simply omitted it, which is every PR that would most
          # have benefited from it. Declaring scope is now mandatory.
          if [ -z "$SCOPE_BLOCK" ]; then
            echo "❌ No Scope: block found in the PR body."
            echo ""
            echo "Every PR must declare which paths it may touch. Add to the description:"
            echo ""
            echo '    ```'
            echo '    Scope:'
            echo '    platform/work/**'
            echo '    test/**'
            echo '    ```'
            exit 1
          fi

          echo "Scope globs found:"
          echo "$SCOPE_BLOCK"
          echo "---"

          # Get changed files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          # Check each changed file against scope globs
          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            MATCHED=false
            while IFS= read -r glob; do
              [ -z "$glob" ] && continue
              # Use bash pattern matching (convert glob to find-style)
              if echo "$file" | grep -q "$(echo "$glob" | sed 's/\*\*/.*/' | sed 's/\*/[^\/]*/')"; then
                MATCHED=true
                break
              fi
            done <<< "$SCOPE_BLOCK"
            if [ "$MATCHED" = false ]; then
              VIOLATIONS="$VIOLATIONS\n  ❌ $file"
            fi
          done <<< "$CHANGED"

          if [ -n "$VIOLATIONS" ]; then
            echo ""
            echo "SCOPE VIOLATION — files changed outside declared scope:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Either expand the Scope: block or revert out-of-scope changes."
            exit 1
          fi

          echo "✅ All changed files are within declared scope."
