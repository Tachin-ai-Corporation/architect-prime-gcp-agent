<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Architect Prime · Work</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --graphite: #202833;
  --charcoal: #313B47;
  --slate: #566373;
  --mist: #AEB8C4;
  --cloud: #E6EBF0;
  --trust-blue: #246B8F;
  --network-teal: #1F9A9B;
  --care-mint: #5FC7B2;
  --signal-aqua: #8FD8E6;
  --clinical-ice: #E8F7FA;
  --amber: #D6A83A;
  --pulse: #D84F45;
  --success: #3BAA78;
  --neutral: #7A8696;

  --border-subtle: rgba(86, 99, 115, 0.28);
  --border-default: rgba(86, 99, 115, 0.4);
  --border-active: rgba(143, 216, 230, 0.48);

  --status-success-fill: rgba(59, 170, 120, 0.14);
  --status-warning-fill: rgba(214, 168, 58, 0.16);
  --status-info-fill: rgba(47, 128, 168, 0.16);

  --glow-aqua: 0 0 0 1px rgba(143, 216, 230, 0.28), 0 0 24px rgba(143, 216, 230, 0.16);
  --shadow-2: 0 8px 28px rgba(0, 0, 0, 0.24);
  --shadow-3: 0 16px 48px rgba(0, 0, 0, 0.32);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --d-hover: 160ms;
  --d-panel: 220ms;
  --d-page: 300ms;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--graphite);
  color: var(--cloud);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ================================================================ TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 32px;
  background: rgba(32, 40, 51, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}
.bc { display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 500; }
.bc span { color: var(--mist); padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer; transition: all var(--d-hover) var(--ease); }
.bc span:hover { color: var(--cloud); background: rgba(143, 216, 230, 0.06); }
.bc span.here { color: var(--signal-aqua); font-weight: 600; }
.bc .sep { padding: 0 2px; font-size: 10px; cursor: default; color: var(--slate); }
.bc .sep:hover { background: none; color: var(--slate); }
.topbar-r { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--mist); }
.needs-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 999px;
  background: var(--status-warning-fill); color: var(--amber);
  font-weight: 600; font-size: 11px;
  animation: warmGlow 3s ease-in-out infinite;
}
@keyframes warmGlow { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px rgba(214, 168, 58, 0.08); } }

/* ================================================================ SHELL */
.shell { max-width: 920px; margin: 0 auto; padding: 32px 32px 100px; }
.pg-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2px; }
.pg-sub { font-size: 14px; color: var(--mist); margin-bottom: 32px; }

/* ================================================================ AGENT STRIP */
.agents {
  display: flex; gap: 8px; padding-bottom: 32px;
  overflow-x: auto; scrollbar-width: none;
}
.agents::-webkit-scrollbar { display: none; }

.ag {
  flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-radius: var(--r-lg); cursor: pointer;
  background: transparent; border: 1px solid transparent;
  transition: all var(--d-panel) var(--ease);
  min-width: 180px;
}
.ag:hover { background: rgba(49, 59, 71, 0.5); }
.ag.sel { background: var(--charcoal); border-color: var(--border-active); }
.ag.sel .ag-name { color: var(--signal-aqua); }

.ag-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.ag-dot.on { background: var(--network-teal); box-shadow: 0 0 10px rgba(31, 154, 155, 0.4); animation: pulse 2s ease-in-out infinite; }
.ag-dot.idle { background: var(--success); opacity: 0.35; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.ag-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ag-name { font-size: 14px; font-weight: 600; color: var(--cloud); white-space: nowrap; }
.ag-doing { font-size: 11px; color: var(--network-teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; animation: fadeText 3.5s ease-in-out infinite; }
.ag-idle { font-size: 11px; color: var(--slate); white-space: nowrap; }
@keyframes fadeText { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ================================================================ EMPTY STATE */
.empty { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.2; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--mist); margin-bottom: 4px; }
.empty-sub { font-size: 13px; color: var(--slate); }

/* ================================================================ WORK PANEL */
.work-panel { opacity: 0; transform: translateY(10px); transition: opacity var(--d-page) var(--ease), transform var(--d-page) var(--ease); pointer-events: none; }
.work-panel.vis { opacity: 1; transform: translateY(0); pointer-events: all; }

/* ================================================================ TABS */
.tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 24px;
}
.tab {
  padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--mist);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all var(--d-hover) var(--ease);
  background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.tab:hover { color: var(--cloud); }
.tab.on { color: var(--signal-aqua); border-bottom-color: var(--network-teal); font-weight: 600; }
.tab .badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; font-size: 10px; font-weight: 700;
  margin-left: 6px; vertical-align: 1px;
}
.tab .badge.teal { background: rgba(31, 154, 155, 0.18); color: var(--network-teal); }
.tab .badge.slate { background: rgba(86, 99, 115, 0.2); color: var(--slate); }
.tab .badge.amber { background: var(--status-warning-fill); color: var(--amber); }

.tab-body { display: none; }
.tab-body.vis { display: block; }

/* ================================================================ TREE ROWS */
.tree { display: flex; flex-direction: column; gap: 0; }

.row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-md); cursor: pointer;
  transition: background var(--d-hover);
}
.row:hover { background: rgba(86, 99, 115, 0.08); }
.row.d1 { padding-left: 36px; }
.row.d2 { padding-left: 60px; }

.r-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
.r-dot.done { background: var(--success); opacity: 0.6; }
.r-dot.active { background: var(--network-teal); box-shadow: 0 0 10px rgba(31, 154, 155, 0.35); animation: pulse 2s ease-in-out infinite; }
.r-dot.waiting { background: var(--amber); box-shadow: 0 0 10px rgba(214, 168, 58, 0.2); animation: pulse 1.5s ease-in-out infinite; }
.r-dot.pending { background: var(--slate); opacity: 0.4; }

.r-body { flex: 1; min-width: 0; }
.r-label { font-size: 14px; color: var(--cloud); line-height: 1.4; }
.r-label.active-l { color: var(--signal-aqua); font-weight: 600; }
.r-label.waiting-l { color: var(--amber); font-weight: 600; }
.r-label.done-l { color: var(--mist); }
.r-label .tag { font-size: 11px; font-weight: 600; color: var(--slate); margin-right: 6px; }
.r-label .tag.m-tag { color: var(--trust-blue); }

.r-meta { font-size: 12px; color: var(--slate); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; }
.r-meta .live { color: var(--network-teal); font-weight: 500; }
.r-meta .warn { color: var(--amber); font-weight: 500; }

.r-prog { width: 90px; height: 3px; background: rgba(31, 154, 155, 0.12); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.r-prog-fill { height: 100%; border-radius: 99px; background: var(--network-teal); transition: width 600ms var(--ease); }

.r-ask {
  margin: 6px 0 0; padding: 10px 14px;
  background: rgba(214, 168, 58, 0.04);
  border-left: 2px solid rgba(214, 168, 58, 0.35);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 13px; color: var(--mist); line-height: 1.55;
}
.r-ask strong { color: var(--cloud); font-weight: 600; }
.r-ask .timer { font-size: 11px; color: var(--amber); margin-top: 4px; font-weight: 500; }

.r-chev {
  color: var(--slate); font-size: 12px; margin-top: 5px; flex-shrink: 0;
  transition: transform 260ms var(--ease); cursor: pointer;
  width: 16px; text-align: center;
}
.r-chev.open { transform: rotate(90deg); color: var(--mist); }

.r-kids { display: none; }
.r-kids.open { display: block; }

/* ================================================================ PAGER */
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px 0; }
.pg-btn {
  padding: 7px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 500;
  background: transparent; border: 1px solid var(--border-subtle); color: var(--mist);
  cursor: pointer; font-family: var(--font); transition: all var(--d-hover) var(--ease);
}
.pg-btn:hover:not(:disabled) { border-color: var(--border-active); color: var(--cloud); background: rgba(143, 216, 230, 0.04); }
.pg-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.pg-info { font-size: 12px; color: var(--slate); padding: 0 8px; }

/* ================================================================ MODAL */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0); backdrop-filter: blur(0);
  pointer-events: none;
  transition: background var(--d-page) var(--ease), backdrop-filter var(--d-page) var(--ease);
}
.overlay.open { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px); pointer-events: all; }

.modal {
  width: 92%; max-width: 620px; max-height: 82vh; overflow-y: auto;
  background: var(--charcoal); border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  transform: translateY(16px) scale(0.97); opacity: 0;
  transition: transform 380ms var(--ease), opacity 280ms var(--ease);
}
.overlay.open .modal { transform: translateY(0) scale(1); opacity: 1; }

.modal-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);
}
.m-type { font-size: 11px; font-weight: 600; color: var(--mist); letter-spacing: 0.06em; }
.m-close {
  width: 28px; height: 28px; border-radius: var(--r-sm);
  background: transparent; border: 1px solid var(--border-subtle);
  color: var(--mist); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); transition: all var(--d-hover) var(--ease);
}
.m-close:hover { background: rgba(86, 99, 115, 0.2); color: var(--cloud); border-color: var(--border-default); }

.m-body { padding: 24px; }
.m-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.m-title.act { color: var(--signal-aqua); }
.m-title.wai { color: var(--amber); }

.m-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.m-chip {
  padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
  background: rgba(86, 99, 115, 0.16); color: var(--mist);
}
.m-chip.c-act { color: var(--network-teal); background: rgba(31, 154, 155, 0.12); }
.m-chip.c-done { color: var(--success); background: var(--status-success-fill); }
.m-chip.c-wait { color: var(--amber); background: var(--status-warning-fill); }

.m-sec { margin-top: 20px; }
.m-sec-title { font-size: 11px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.m-block { padding: 14px 16px; background: var(--graphite); border-radius: var(--r-md); font-size: 14px; color: var(--mist); line-height: 1.6; }
.m-block strong { color: var(--cloud); font-weight: 600; }
.m-block .timer { font-size: 11px; color: var(--amber); margin-top: 6px; font-weight: 500; }

.m-grid { display: grid; grid-template-columns: 100px 1fr; gap: 0; }
.m-grid .mk { font-size: 12px; font-weight: 600; color: var(--slate); padding: 7px 0; }
.m-grid .mv { font-size: 14px; color: var(--cloud); padding: 7px 0; border-bottom: 1px solid var(--border-subtle); }
.m-grid .mv:last-child { border-bottom: none; }

.m-prog { margin: 12px 0; }
.m-prog-bar { height: 4px; background: rgba(86, 99, 115, 0.2); border-radius: 99px; overflow: hidden; }
.m-prog-fill { height: 100%; border-radius: 99px; transition: width 500ms var(--ease); }
.m-prog-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--mist); margin-top: 5px; }

.m-kids { display: flex; flex-direction: column; gap: 0; }
.m-kid { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
.m-kid:last-child { border-bottom: none; }
.mk-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.m-kid .mk-text { color: var(--mist); flex: 1; }
.m-kid .mk-text strong { color: var(--cloud); font-weight: 600; }

@media (max-width: 768px) {
  .shell { padding: 20px 16px 60px; }
  .topbar { padding: 10px 16px; }
  .ag { min-width: 160px; padding: 10px 14px; }
  .row.d1 { padding-left: 28px; }
  .row.d2 { padding-left: 44px; }
  .modal { width: 96%; border-radius: var(--r-lg); }
  .m-body { padding: 18px; }
  .tabs { overflow-x: auto; }
}
</style>
</head>

</div>

var selAgent=null,curTab='current',prevPage=0,PAGE=10;

// ================================================================ RENDER AGENTS
function renderAgents(){
  var el=document.getElementById('agents'),h='';
  AGENTS.forEach(function(a){
    h+='<div class="ag" data-id="'+a.id+'">';
    h+='<span class="ag-dot '+(a.working?'on':'idle')+'"></span>';
    h+='<div class="ag-info"><span class="ag-name">'+a.name+'</span>';
    h+='<span class="'+(a.working?'ag-doing':'ag-idle')+'">'+a.doing+'</span>';
    h+='</div></div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('.ag').forEach(function(c){c.addEventListener('click',function(){selectAgent(c.dataset.id)})});
}

function selectAgent(id){
  selAgent=id;prevPage=0;curTab='current';
  document.querySelectorAll('.ag').forEach(function(c){c.classList.toggle('sel',c.dataset.id===id)});
  document.getElementById('empty').style.display='none';
  var p=document.getElementById('panel');p.classList.remove('vis');
  setTimeout(function(){
    updateBadges(id);renderTab();
    document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab==='current')});
    document.querySelectorAll('.tab-body').forEach(function(b){b.classList.toggle('vis',b.id==='tb-current')});
    p.classList.add('vis');
  },50);
}

function updateBadges(id){
  document.getElementById('badge-current').textContent=(CURRENT[id]||[]).length;
  document.getElementById('badge-queue').textContent=(QUEUE[id]||[]).length;
  document.getElementById('badge-prev').textContent=(PREV[id]||[]).length;
}

// ================================================================ TABS
document.getElementById('tabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(!t)return;
  curTab=t.dataset.tab;prevPage=0;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.tab===curTab)});
  document.querySelectorAll('.tab-body').forEach(function(b){b.classList.toggle('vis',b.id==='tb-'+curTab)});
  renderTab();
});

function renderTab(){
  if(!selAgent)return;
  if(curTab==='current')renderTree('tree-current',CURRENT[selAgent]||[]);
  else if(curTab==='queue')renderTree('tree-queue',QUEUE[selAgent]||[]);
  else renderPrev();
}

// ================================================================ TREE RENDERER (shared)
function renderTree(elId,missions){
  var el=document.getElementById(elId);
  if(!missions.length){el.innerHTML='<div style="padding:24px 0;color:var(--slate);font-size:13px">Nothing here</div>';return}
  var h='';
  missions.forEach(function(m){h+=renderNode(m,0)});
  el.innerHTML=h;
  attachHandlers(el);
}

function renderNode(n,d){
  var st=n.status,hasK=n.children&&n.children.length>0;
  var isOpen=st==='active'||st==='waiting'||hasAct(n);
  var dotCls=st==='done'?'done':st==='active'?'active':st==='waiting'?'waiting':'pending';
  var lblCls=st==='active'?' active-l':st==='waiting'?' waiting-l':st==='done'?' done-l':'';
  var tagCls=n.type==='M'?' m-tag':'';

  var h='<div class="row d'+d+'" data-id="'+n.id+'">';
  h+='<span class="r-dot '+dotCls+'"></span>';
  h+='<div class="r-body">';
  h+='<div class="r-label'+lblCls+'"><span class="tag'+tagCls+'">'+n.type+'</span>'+n.title+'</div>';

  var meta=[];
  if(n.agent)meta.push(n.agent);
  if(n.project)meta.push(n.project);
  if(n.elapsed)meta.push('<span class="live">'+n.elapsed+' elapsed</span>');
  if(n.waitTime)meta.push('<span class="warn">⚡ '+n.waitTime+'</span>');
  if(n.duration&&st==='done')meta.push(n.duration);
  if(n.completed)meta.push(n.completed);
  if(meta.length)h+='<div class="r-meta">'+meta.join(' · ')+'</div>';

  if(st==='active'&&n.progress!=null){
    h+='<div class="r-prog"><div class="r-prog-fill" style="width:'+n.progress+'%"></div></div>';
  }
  if(st==='waiting'&&n.waitingFor){
    h+='<div class="r-ask"><strong>'+(n.agent||'Agent')+' asks:</strong> '+n.waitingFor;
    h+='<div class="timer">Waiting '+(n.waitTime||'')+' · timeout '+(n.timeout||'')+'</div></div>';
  }
  h+='</div>';
  if(hasK)h+='<span class="r-chev'+(isOpen?' open':'')+'" data-toggle="'+n.id+'">›</span>';
  h+='</div>';

  if(hasK){
    h+='<div class="r-kids'+(isOpen?' open':'')+'" data-parent="'+n.id+'">';
    n.children.forEach(function(c){h+=renderNode(c,d+1)});
    h+='</div>';
  }
  return h;
}

function hasAct(n){
  if(!n.children)return false;
  for(var i=0;i<n.children.length;i++){
    if(n.children[i].status==='active'||n.children[i].status==='waiting')return true;
    if(hasAct(n.children[i]))return true;
  }return false;
}

function attachHandlers(el){
  el.querySelectorAll('.r-chev').forEach(function(ch){
    ch.addEventListener('click',function(e){
      e.stopPropagation();
      var kids=el.querySelector('[data-parent="'+ch.dataset.toggle+'"]');
      if(!kids)return;
      var open=kids.classList.contains('open');
      kids.classList.toggle('open',!open);
      ch.classList.toggle('open',!open);
    });
  });
  el.querySelectorAll('.row').forEach(function(r){
    r.addEventListener('click',function(e){
      if(e.target.classList.contains('r-chev'))return;
      openModal(r.dataset.id);
    });
  });
}

// ================================================================ PREVIOUS WORK (paginated)
function renderPrev(){
  var items=PREV[selAgent]||[];
  var el=document.getElementById('tree-prev');
  var pager=document.getElementById('pager');
  var total=items.length,pages=Math.ceil(total/PAGE);
  var slice=items.slice(prevPage*PAGE,(prevPage+1)*PAGE);

  if(!slice.length){el.innerHTML='<div style="padding:24px 0;color:var(--slate);font-size:13px">No previous work</div>';pager.innerHTML='';return}

  var h='';
  slice.forEach(function(m){h+=renderNode(m,0)});
  el.innerHTML=h;
  attachHandlers(el);

  if(pages>1){
    pager.innerHTML='<button class="pg-btn" id="pp" '+(prevPage===0?'disabled':'')+'>← Prev</button>'
      +'<span class="pg-info">'+(prevPage+1)+' / '+pages+'</span>'
      +'<button class="pg-btn" id="pn" '+(prevPage>=pages-1?'disabled':'')+'>Next →</button>';
    document.getElementById('pp').addEventListener('click',function(){if(prevPage>0){prevPage--;renderPrev()}});
    document.getElementById('pn').addEventListener('click',function(){if(prevPage<pages-1){prevPage++;renderPrev()}});
  }else{pager.innerHTML=''}
}

// ================================================================ MODAL
function findAll(id){
  var pools=[CURRENT,QUEUE,PREV];
  for(var p=0;p<pools.length;p++){for(var k in pools[p]){var r=deep(id,pools[p][k]);if(r)return r}}return null;
}
function deep(id,arr){
  if(!arr)return null;
  for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];if(arr[i].children){var f=deep(id,arr[i].children);if(f)return f}}return null;
}

function openModal(nid){
  var n=findAll(nid);if(!n)return;
  document.getElementById('m-type').textContent=n.type==='M'?'MISSION':n.type==='C'?'CHECKPOINT':'TASK';
  var b=document.getElementById('m-body');
  var tc=n.status==='active'?' act':n.status==='waiting'?' wai':'';
  var h='<div class="m-title'+tc+'">'+n.title+'</div><div class="m-chips">';
  var sl=n.status==='active'?'In progress':n.status==='done'?'Complete':n.status==='waiting'?'Needs input':'Pending';
  var sc=n.status==='active'?'c-act':n.status==='done'?'c-done':n.status==='waiting'?'c-wait':'';
  h+='<span class="m-chip '+sc+'">'+sl+'</span>';
  if(n.agent)h+='<span class="m-chip">'+n.agent+'</span>';
  if(n.project)h+='<span class="m-chip">'+n.project+'</span>';
  h+='</div>';

  if(n.progress!=null&&n.progress>0&&n.progress<100){
    var fc=n.status==='waiting'?'var(--amber)':'var(--network-teal)';
    h+='<div class="m-prog"><div class="m-prog-bar"><div class="m-prog-fill" style="width:'+n.progress+'%;background:'+fc+'"></div></div>';
    h+='<div class="m-prog-lbl"><span>'+n.progress+'%</span>';
    if(n.elapsed)h+='<span>'+n.elapsed+' elapsed</span>';
    h+='</div></div>';
  }
  if(n.dod)h+='<div class="m-sec"><div class="m-sec-title">Definition of done</div><div class="m-block">'+n.dod+'</div></div>';
  if(n.status==='waiting'&&n.waitingFor){
    h+='<div class="m-sec"><div class="m-sec-title">Waiting for input</div><div class="m-block" style="border-left:2px solid rgba(214,168,58,0.35)">';
    h+='<strong>'+(n.agent||'Agent')+' asks:</strong> '+n.waitingFor+'<div class="timer">Waiting '+(n.waitTime||'')+' · timeout '+(n.timeout||'')+'</div></div></div>';
  }
  if(n.output)h+='<div class="m-sec"><div class="m-sec-title">Output</div><div class="m-block">'+n.output+'</div></div>';

  h+='<div class="m-sec"><div class="m-sec-title">Details</div><div class="m-grid">';
  if(n.created)h+='<span class="mk">Created</span><span class="mv">'+n.created+'</span>';
  if(n.started)h+='<span class="mk">Started</span><span class="mv">'+n.started+'</span>';
  if(n.completed)h+='<span class="mk">Completed</span><span class="mv">'+n.completed+'</span>';
  if(n.duration)h+='<span class="mk">Duration</span><span class="mv">'+n.duration+'</span>';
  h+='<span class="mk">ID</span><span class="mv" style="font-size:12px;color:var(--slate)">'+n.id+'</span>';
  h+='</div></div>';

  if(n.children&&n.children.length){
    h+='<div class="m-sec"><div class="m-sec-title">'+(n.type==='M'?'Checkpoints':'Tasks')+'</div><div class="m-kids">';
    n.children.forEach(function(c){
      var dc=c.status==='done'?'var(--success)':c.status==='active'?'var(--network-teal)':c.status==='waiting'?'var(--amber)':'var(--slate)';
      h+='<div class="m-kid"><span class="mk-dot" style="background:'+dc+'"></span><span class="mk-text"><strong>'+c.title+'</strong>';
      if(c.agent)h+=' — '+c.agent;
      if(c.duration)h+=' · '+c.duration;
      if(c.status==='active'&&c.progress)h+=' · '+c.progress+'%';
      if(c.status==='waiting')h+=' · <span style="color:var(--amber)">needs input</span>';
      h+='</span></div>';
    });
    h+='</div></div>';
  }
  b.innerHTML=h;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeM(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}
document.getElementById('m-close').addEventListener('click',closeM);
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeM()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});

// ================================================================ INIT
renderAgents();
</script>
